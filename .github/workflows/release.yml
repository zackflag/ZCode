name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀，例如 3.14.0-audit.1）"
        required: true
        type: string
      prerelease:
        description: "标记为预发布（Pre-release）"
        required: false
        type: boolean
        default: false
      build_artifacts:
        description: "构建 Windows x64 桌面安装包并上传到 Release"
        required: false
        type: boolean
        default: true
      resume_existing_release:
        description: "恢复已创建标签或 Release 的中断发布"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RESUME_EXISTING_RELEASE: ${{ inputs.resume_existing_release }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version \"$VERSION\". Expected semver like 3.14.0 or 3.14.0-audit.1"
            exit 1
          fi
          TAG="v$VERSION"
          tag_exists=false
          release_exists=false
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_exists=true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_exists=true
          fi
          if [ "$RESUME_EXISTING_RELEASE" != "true" ] && { [ "$tag_exists" = "true" ] || [ "$release_exists" = "true" ]; }; then
            echo "::error::Tag or Release $TAG already exists; enable resume_existing_release to recover an interrupted release"
            exit 1
          fi
          if [ "$release_exists" = "true" ] && [ "$tag_exists" != "true" ]; then
            echo "::error::Release $TAG exists without its Git tag"
            exit 1
          fi
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
          TAG_EXISTS: ${{ steps.validate.outputs.tag_exists }}
          RELEASE_EXISTS: ${{ steps.validate.outputs.release_exists }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EXISTS" = "true" ]; then
            echo "Reusing existing release $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$TAG_EXISTS" != "true" ]; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          cat > /tmp/release-notes.md <<'NOTES'
          ## 安装

          > 安装包未做代码签名。首次运行前可以按本页 sha256 校验文件。

          ### Windows（.exe）

          双击安装。安装包未签名，SmartScreen 会弹出“Windows 已保护你的电脑”的警告：
          点“**更多信息**” → “**仍要运行**”即可——这是未签名应用的常规提示，不是文件损坏。

          ## 关于这个版本

          基于上游开源代码的审计版本：监控与遥测已全部移除，上游改动逐提交审阅。改动细节见仓库 README。
          NOTES
          args=(--title "$TAG" --notes-file /tmp/release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  desktop:
    needs: release
    if: ${{ inputs.build_artifacts }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win
            arch: x64
            glob: "*.exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project references
        run: pnpm typecheck

      - name: Bundle desktop app
        env:
          ZCODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm bundle:desktop -- --os ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload desktop asset to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          ls -la packages/desktop/dist/
          # latest.yml 是 Windows electron-updater 的更新元数据，blockmap 供差分下载。
          shopt -s nullglob
          files=(
            packages/desktop/dist/${{ matrix.glob }}
            packages/desktop/dist/latest.yml
            packages/desktop/dist/*.blockmap
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no desktop assets matched in packages/desktop/dist"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
